# TeamManix, development overlay: api in watch mode with mounted source, db exposed on :5433.
services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    # API configuration: apps/api/.env.dev (versioned defaults), then apps/api/.env (personal, optional,
    # not versioned), which overrides them. Only container-bound values remain below, and they take precedence.
    # Examples for apps/api/.env: BREVO_API_KEY and MAIL_FROM_EMAIL (real mail), E2E_OUTBOX=1 (exposes the mail on
    # /api/__test/outbox, needed by the e2e tests), STORAGE_DRIVER=s3 with the S3_* variables listed in
    # docker-compose.prod.yml.
    env_file:
      - apps/api/.env.dev
      - path: apps/api/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgres://teammanix:${POSTGRES_PASSWORD:-devpassword}@db:5432/teammanix
      # Sensitive files: on disk in development (dedicated volume, outside the mounted source). The encryption key
      # is derived from JWT_SECRET.
      STORAGE_DIR: /data/storage
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - certificates:/data/storage
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  certificates:
