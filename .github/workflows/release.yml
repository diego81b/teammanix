name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  production:
    name: production
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the tag on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge to main before tagging."
            exit 1
          fi
      - name: Point production at the tag
        run: git push origin "$GITHUB_SHA:refs/heads/production"
