# TeamManix, base SVILUPPO: solo il database. Si combina con docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
name: teammanix

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teammanix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: teammanix
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teammanix -d teammanix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
