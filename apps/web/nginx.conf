server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Hashed build assets: cache for a year.
  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The shell and the service worker must always be revalidated, or a deploy is not picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA fallback: every client route serves the shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
