# TeamManix, produzione su Coolify (Hetzner). File STANDALONE, non un overlay:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Il DB è una risorsa Postgres gestita da Coolify (non definita qui): DATABASE_URL arriva dalle variabili
# d'ambiente dell'applicazione in Coolify. Backup: schedulati dalla risorsa DB di Coolify (S3 esterno).
# Routing e TLS: Traefik di Coolify. Le label di porta servono perché Traefik ha exposedbydefault=false;
# Coolify aggiunge dominio e TLS al deploy.
# Migrazioni e seed (idempotenti) girano all'avvio del container prima dell'api: se falliscono il
# container non parte e Coolify mantiene la versione precedente.
# Frontend: quando esiste, si aggiunge come secondo servizio con lo stesso schema di label.
name: teammanix

services:
  api:
    build:
      context: apps/api
      target: runner
    restart: unless-stopped
    command: ["sh", "-c", "node dist/src/migrate.js && node dist/src/main.js"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.teammanix-api.loadbalancer.server.port=3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?impostare DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?impostare JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      APP_URL: ${APP_URL:?impostare APP_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?impostare ALLOWED_ORIGINS}
      BREVO_API_KEY: ${BREVO_API_KEY:?impostare BREVO_API_KEY}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:?impostare MAIL_FROM_EMAIL}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TeamManix}
      # File sensibili (certificati medici e altri documenti): cifrati dall'app (AES-256-GCM) prima dell'upload su un
      # bucket S3 compatibile (Cloudflare R2, Hetzner, MinIO). Senza queste variabili l'API non parte.
      STORAGE_DRIVER: s3
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?impostare STORAGE_ENCRYPTION_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:?impostare S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?impostare S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?impostare S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?impostare S3_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - coolify
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  coolify:
    external: true
