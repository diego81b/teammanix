# TeamManix, production on Coolify (Hetzner). STANDALONE file, not an overlay:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The DB is a Postgres resource managed by Coolify (not defined here): DATABASE_URL comes from the application's
# environment variables in Coolify. Backups: scheduled by Coolify's DB resource (external S3).
# Routing and TLS: Coolify's Traefik. The port labels are needed because Traefik has exposedbydefault=false;
# Coolify adds domain and TLS at deploy time.
# Migrations and seed (idempotent) run at container start, before the api: if they fail, the
# container does not start and Coolify keeps the previous version.
# Frontend: when it exists, add it as a second service with the same label scheme.
name: teammanix

services:
  api:
    build:
      context: apps/api
      target: runner
    restart: unless-stopped
    command: ["sh", "-c", "node dist/src/migrate.js && node dist/src/main.js"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.teammanix-api.loadbalancer.server.port=3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      APP_URL: ${APP_URL:?set APP_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      BREVO_API_KEY: ${BREVO_API_KEY:?set BREVO_API_KEY}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:?set MAIL_FROM_EMAIL}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TeamManix}
      # Sensitive files (medical certificates and other documents): encrypted by the app (AES-256-GCM) before upload to an
      # S3-compatible bucket (Cloudflare R2, Hetzner, MinIO). Without these variables the API does not start.
      STORAGE_DRIVER: s3
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?set STORAGE_ENCRYPTION_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      # Web Push (optional): without the two keys push is off and the app works as before. Generate the pair for production
      # with `npx web-push generate-vapid-keys`, set it as Coolify secrets, never commit it. Changing the pair drops every
      # registered device. VAPID_SUBJECT is a `mailto:` or `https:` contact for the push services.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - coolify
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  coolify:
    external: true
